name: Construire l'APK Android

# L'APK est construit sur GitHub avec EAS (`eas build --local`) et signé avec la
# clé de l'application stockée sur EAS : les mises à jour restent compatibles
# avec les builds EAS. Prérequis : `npx eas-cli init` (identifiant du projet
# dans app.json) et un secret de dépôt EXPO_TOKEN.

# À chaque déploiement (push sur main ou sur la branche de travail), un nouvel APK est
# construit et publié comme « version » GitHub (tag build-N). L'application installée
# vérifie cette version au démarrage et propose la mise à jour.

on:
  workflow_dispatch:
  push:
    branches: [main, claude/open-source-mobile-app-ufs08v]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]

# Un seul build à la fois : un nouveau déploiement annule le build précédent.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if ! node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::error::Projet EAS non configuré : lancez « npx eas-cli init » puis commitez app.json."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # Le paquet « tools » (installé par défaut) n'existe plus dans le dépôt du SDK.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run typecheck

      - name: Numéroter la version (versionCode = numéro du build)
        run: |
          node -e '
            const fs = require("fs");
            const n = Number(process.env.GITHUB_RUN_NUMBER) + 1;
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.version = `1.0.${n}`;
            cfg.expo.android.versionCode = n;
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
            console.log(`Version 1.0.${n} (versionCode ${n})`);
          '
          echo "NUMERO=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"

      - name: Compiler l'APK signé avec EAS
        run: eas build --platform android --profile apk --local --non-interactive --output marceau.apk

      # PRoot (GPL-2.0) et talloc (LGPL-3.0) sont compilés dans l'APK : leur code source
      # exact est publié avec chaque version (obligation de ces licences).
      - name: Préparer le code source des programmes GPL inclus
        run: bash scripts/construire-linux.sh --sources

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: marceau-apk
          path: marceau.apk

      - name: Publier la mise à jour (version GitHub build-N)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.NUMERO }}
          target_commitish: ${{ github.sha }}
          name: Marceau 1.0.${{ env.NUMERO }}
          body: ${{ github.event.head_commit.message || 'Nouvelle version de Marceau' }}
          make_latest: true
          files: |
            marceau.apk
            build/linux/marceau-sources-linux.tar.gz
