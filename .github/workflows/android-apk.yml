name: Construire l'APK Android

# L'APK est construit sur GitHub avec EAS (`eas build --local`) et signé avec la
# clé de l'application stockée sur EAS : les mises à jour restent compatibles
# avec les builds EAS. Prérequis : `npx eas-cli init` (identifiant du projet
# dans app.json) et un secret de dépôt EXPO_TOKEN.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if ! node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "::error::Projet EAS non configuré : lancez « npx eas-cli init » puis commitez app.json."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run typecheck

      - name: Compiler l'APK signé avec EAS
        run: eas build --platform android --profile apk --local --non-interactive --output marceau.apk

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: marceau-apk
          path: marceau.apk

      - name: Joindre l'APK à la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: marceau.apk
